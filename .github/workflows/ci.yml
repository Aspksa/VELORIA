name: VELORIA CI
on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: node --check game.js && node --check sprite-art.js
      - name: Sprite atlas regression
        run: node tests/sprites.cjs
      - name: Headless simulation regression
        run: node tests/simulation.cjs
